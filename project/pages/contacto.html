    <main>
        <h2>En qué podemos ayudarte?</h2>
        <form action="" method="post" autocomplete="on" class="formulario">
            <div>
                <label for="nombre">Nombre completo: </label>
                <input id="nombre" type="text" placeholder="Ej: Sol Herrera">
            </div>
            <div>
                <label for="correo">Correo electrónico: </label>
                <input id="correo" type="email" placeholder="Ej:sol@mail.com">
            </div>
            <div>
                <label for="comentario">Comentario</label>
                <input id="comentario" type="text" placeholder="Contanos en qué podemos ayudarte">
            </div>
            <div>
                <button type="submit">Enviar</button>
        </form>
    </main>
